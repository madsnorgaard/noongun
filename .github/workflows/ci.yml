name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint, Larastan, migrations and Pest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_DB: noongun_testing
          POSTGRES_USER: noongun
          POSTGRES_PASSWORD: noongun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noongun -d noongun_testing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: noongun_testing
      DB_USERNAME: noongun
      DB_PASSWORD: noongun
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v7

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, pgsql, redis, pcntl, intl, zip, bcmath, gd
          ini-values: upload_max_filesize=32M, post_max_size=32M
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migrations run forwards and backwards
        run: |
          php artisan migrate:fresh --force --no-interaction
          php artisan migrate:reset --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Pest
        run: vendor/bin/pest
