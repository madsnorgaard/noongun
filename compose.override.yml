# Local development. Docker Compose merges this file into docker-compose.yml
# automatically. For a production-like run without it, use:
#   docker compose -f docker-compose.yml up -d

x-dev: &dev
  build:
    context: .
    dockerfile: docker/app/Dockerfile
    target: dev
    args:
      UID: ${NOONGUN_UID:-1000}
      GID: ${NOONGUN_GID:-1000}
  image: noongun-app:dev
  restart: "no"
  # Replaces the volumes of docker-compose.yml, so that in development
  # images are plain files under ./storage/app/media in the checkout.
  volumes: !override
    - .:/app
    - ./storage:/app/storage

# Laravel reads the mounted .env directly in development. Not passing it as
# container environment keeps phpunit.xml in control of the test settings.
services:
  app:
    <<: *dev
    env_file: !reset []
    environment:
      NOONGUN_ROLE: app
      NOONGUN_AUTO_MIGRATE: ${NOONGUN_AUTO_MIGRATE:-true}

  horizon:
    <<: *dev
    env_file: !reset []

  scheduler:
    <<: *dev
    env_file: !reset []

  vite:
    <<: *dev
    profiles: ["vite"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      VITE_HMR_PORT: ${NOONGUN_VITE_PORT:-5173}
    ports:
      - "${NOONGUN_VITE_PORT:-5173}:5173"
    depends_on: []
